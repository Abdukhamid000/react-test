version: "3.8"

services:
  react-app:
    build: ./my-app
    restart: always
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # We will mount SSL certificates here later
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - react-app
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  - /etc/nginx/ssl:/etc/nginx/ssl:ro
